services:
  single-leaf:
    image: ronxldwilson/single-leaf:latest
    build: .
    ports:
      - "8081:8081"
    environment:
      - SINGLE_LEAF_PORT=8081
      - SEARXNG_URL=http://searxng:8080
      - ZENPANDA_URL=http://zenpanda:9222
      - DEEP_RENDER_COUNT=10
      - DEEP_WAIT_MS=1500
      - DEEP_TIMEOUT_MS=10000
      - SEARCH_TIMEOUT_MS=7000
    depends_on:
      tor-proxy:
        condition: service_healthy
      searxng:
        condition: service_started
      zenpanda:
        condition: service_started
    restart: unless-stopped

  zenpanda:
    image: ronxldwilson/zenpanda:latest
    ports:
      - "9222:9222"
    restart: unless-stopped

  tor-proxy:
    image: ronxldwilson/tor-proxy-pool:latest
    environment:
      - TOR_INSTANCES=100
      - TOR_REBUILD_INTERVAL=1800
    ports:
      - "3128:3128"
      - "4444:4444"
    restart: unless-stopped

  searxng:
    image: ronxldwilson/searxng-slim:latest
    ports:
      - "8080:8080"
    environment:
      - SEARXNG_PORT=8080
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    depends_on:
      - tor-proxy
    restart: unless-stopped
